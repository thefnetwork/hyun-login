<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>현비서 연결</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; }
  main { width: min(360px, 100% - 32px); display: grid; gap: 14px; }
  h1 { font-size: 22px; margin: 0; }
  p { margin: 0; color: #aaa; line-height: 1.5; }
  input { font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; }
  button { font-size: 16px; font-weight: 600; padding: 12px; border-radius: 12px; border: 0; background: #4f7cff; color: #fff; cursor: pointer; }
  button.secondary { background: #1a1a1a; }
  button:disabled { opacity: .5; }
  .error { color: #ff7a7a; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>현비서 연결</h1>
  <p id="status">확인하는 중…</p>

  <form id="login" hidden>
    <input id="email" type="email" autocomplete="username" placeholder="이메일" required>
    <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
    <button type="submit">로그인</button>
  </form>

  <div id="consent" hidden>
    <button id="approve">연결 허용</button>
    <button id="deny" class="secondary">거절</button>
  </div>
</main>
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const supabase = createClient('https://fjnuezpvuiqkfsttlksy.supabase.co', 'sb_publishable_Sy5W0KcpS099McvE2_Ij_w_RPjjvqfJSTimers');
  const authorizationId = new URLSearchParams(location.search).get('authorization_id');
  const $ = (id) => document.getElementById(id);
  const say = (text, error = false) => { $('status').textContent = text; $('status').className = error ? 'error' : ''; };

  async function showConsent() {
    $('login').hidden = true;
    say('확인하는 중…');
    const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
    if (error || !data) return say(`연결 요청을 확인하지 못했습니다: ${error?.message ?? '알 수 없는 오류'}`, true);
    // 전에 허용한 적이 있으면 바로 돌아간다
    if (!('authorization_id' in data)) return location.replace(data.redirect_url);
    say(`「${data.client?.name ?? '알 수 없는 앱'}」이(가) 현비서의 기억을 읽고 쓰려고 합니다. 직접 연결을 시작한 경우에만 허용하세요.`);
    $('consent').hidden = false;
  }

  async function decide(approve) {
    $('approve').disabled = $('deny').disabled = true;
    const { data, error } = approve
      ? await supabase.auth.oauth.approveAuthorization(authorizationId)
      : await supabase.auth.oauth.denyAuthorization(authorizationId);
    if (error) { $('approve').disabled = $('deny').disabled = false; return say(`처리하지 못했습니다: ${error.message}`, true); }
    location.replace(data.redirect_url);
  }

  $('approve').addEventListener('click', () => decide(true));
  $('deny').addEventListener('click', () => decide(false));
  $('login').addEventListener('submit', async (event) => {
    event.preventDefault();
    say('로그인하는 중…');
    const { error } = await supabase.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    if (error) return say('이메일이나 비밀번호가 맞지 않습니다', true);
    await showConsent();
  });

  if (!authorizationId) {
    say('이 화면은 Claude 에서 현비서를 연결할 때만 쓰입니다.');
  } else {
    const { data } = await supabase.auth.getSession();
    if (data.session) await showConsent();
    else { say('현비서 계정으로 로그인해 주세요.'); $('login').hidden = false; }
  }
</script>
</body>
</html>
